; =============================================================================
; supervisor.conf — Process management for Polymarket BTC trading bot.
;
; Manages the bot and dashboard as supervised processes with auto-restart.
; The primary [polybot] program runs bot.py with ENABLE_DASHBOARD=true,
; which spawns the Streamlit dashboard as a child process connected via
; multiprocessing queues (live balance, trade events, control commands).
;
; The [dashboard-standalone] program is a fallback for running the dashboard
; independently without the bot (e.g., for debugging or viewing historical
; data). It has autostart=false — start manually with:
;     supervisorctl start dashboard-standalone
;
; Install:
;     cp /home/user/Polybot/supervisor.conf /etc/supervisor/conf.d/polybot.conf
;     supervisorctl reread && supervisorctl update
;
; Logs:
;     tail -f /var/log/polybot/bot.log
;     tail -f /var/log/polybot/dashboard.log
; =============================================================================

[program:polybot]
command=/home/user/Polybot/venv/bin/python bot.py
directory=/home/user/Polybot
environment=ENABLE_DASHBOARD="true"
autostart=true
autorestart=true
startsecs=5                     ; consider started after 5s without crash
stopwaitsecs=15                 ; allow graceful shutdown (cancel_all orders)
redirect_stderr=true
stdout_logfile=/var/log/polybot/bot.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

; Standalone dashboard — only use when bot is NOT running with ENABLE_DASHBOARD.
; Runs Streamlit directly without queue connections (shows placeholder data).
[program:dashboard-standalone]
command=/home/user/Polybot/venv/bin/python -m streamlit run dashboard.py --server.headless true --server.port 8501 --server.address 0.0.0.0
directory=/home/user/Polybot
autostart=false
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/polybot/dashboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
